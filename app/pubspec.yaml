name: ai_news_reader
description: News — AI news reader for phone and desktop.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  news_core:
    path: ../packages/news_core
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  # 0.6+ is a no-op (sqlite3 3.x GitHub hooks). Keep 0.5.x so SQLite is
  # compiled locally instead of downloaded from GitHub during Android builds.
  sqlite3_flutter_libs: ">=0.5.32 <0.6.0"
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.4
  url_launcher: ^6.3.1
  window_manager: ^0.5.0
  go_router: ^16.0.0
  audioplayers: ^6.7.1
  http: ^1.6.0
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# sqlite3 3.x otherwise downloads prebuilt .so/.dll from GitHub at build time
# (blocked or timed out in many mainland networks). Use the copy provided by
# sqlite3_flutter_libs (Windows/Linux) or the OS / sqflite plugin (Android).
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config/sources.yaml
    - assets/data/snapshot.json
    - assets/icons/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
